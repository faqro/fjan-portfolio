name: Deploy to faqro.github.io

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Checkout target repository (faqro/faqro.github.io)
        uses: actions/checkout@v4
        with:
          repository: faqro/faqro.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: target-repo

      - name: Replace index.html and assets in target repository
        run: |
          rm -rf target-repo/index.html target-repo/assets
          cp -r dist/. target-repo/

      - name: Commit and push to faqro/faqro.github.io
        working-directory: target-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push
